# Réglages de l'hébergeur : Netlify sert Next tel quel (son runtime le
# détecte de lui-même) et reconstruit le site à chaque envoi sur main.
#
# Un seul réglage à poser dans l'interface (Site settings → Environment
# variables) : ADMIN_PASSWORD, qui ouvre /admin. Puis, quand l'infolettre
# sera branchée, BREVO_API_KEY et BREVO_LIST_ID. Ici, la valeur se colle
# nue : les guillemets qu'exige .env.local en local feraient partie du
# mot de passe.
#
# La version de Node est épinglée : Next 16 en exige une récente, et la
# valeur par défaut de l'hébergeur change avec le temps.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

  # L'hébergeur relit tout ce qu'il a produit et refuse de publier s'il y
  # reconnaît la valeur d'une variable secrète. Le compilateur de Next
  # recopie l'environnement dans son cache de travail : le mot de passe
  # s'y retrouve, et le déploiement s'arrête. On écarte donc ces deux
  # dossiers de cache — ils ne sont jamais servis aux visiteurs. Le reste
  # du site, lui, continue d'être inspecté : si le mot de passe fuyait
  # dans une page, le garde-fou jouerait toujours.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"
