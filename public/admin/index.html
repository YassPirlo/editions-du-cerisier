<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration — Éditions du Cerisier</title>
    <!-- L'adresse de la configuration, épinglée : servie depuis /admin (sans
         barre finale, comme le fait Next), la résolution relative de Decap
         viserait la racine du site. -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      /* Les outils se rangent en bas à GAUCHE : le coin droit est occupé
         par le badge de l'hébergeur, qui recouvrait « Fréquentation ». */
      .outil {
        position: fixed;
        bottom: 1rem;
        left: 1rem;
        z-index: 99999;
        background: #171008;
        color: #f7ece5;
        padding: 0.55rem 1rem;
        font: 700 0.7rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        border: 0;
        border-top: 3px solid #ffc107;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--
      La porte est désormais celle de Decap, ouverte par DecapBridge : la
      maison se connecte avec son adresse de courriel et son mot de passe,
      et DecapBridge écrit dans le dépôt à sa place.

      Cette page portait auparavant un écran de connexion sur mesure, adossé
      à /api/admin/session et au guichet /api/cms. Ce guichet écrivait sur le
      disque du serveur ; en ligne ce disque est en lecture seule, et les
      enregistrements se perdaient en silence. L'écran de Decap, ouvert par
      DecapBridge, le remplace : ce qui est enregistré part dans le dépôt.

      L'ancienne version reste dans l'historique du dépôt :
      git show HEAD:public/admin/index.html
    -->
    <script src="https://unpkg.com/decap-cms@%5E3.8.3/dist/decap-cms.js"></script>
    <script>
      CMS.registerPreviewStyle("/admin/preview.css");
    </script>

    <!-- Les chiffres de fréquentation vivent dans leur propre page : le lien
         n'apparaît qu'une fois le CMS ouvert, pour ne pas s'afficher
         par-dessus l'écran de connexion. -->
    <script>
      (function () {
        "use strict";
        if (!window.CMS || !CMS.registerEventListener) return;
        CMS.registerEventListener({
          name: "login",
          handler: function () {
            if (document.querySelector(".outil")) return;
            var lien = document.createElement("a");
            lien.className = "outil";
            lien.href = "/admin/stats.html";
            lien.textContent = "Fréquentation";
            document.body.appendChild(lien);
          },
        });
      })();
    </script>
  </body>
</html>
